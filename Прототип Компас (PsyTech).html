<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Компас · Цифровой ассистент врача</title>
<style>
:root{
  --blue:#2563eb;--blue-50:#eff6ff;--blue-100:#dbeafe;
  --purple:#7c3aed;--purple-50:#f5f3ff;
  --red:#dc2626;--red-50:#fef2f2;
  --yellow:#d97706;--yellow-50:#fffbeb;--yellow-100:#fef3c7;
  --green:#059669;--green-50:#ecfdf5;
  --bg:#f8fafc;--text:#0f172a;--muted:#64748b;--border:#e2e8f0;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
input,textarea{font-family:inherit}

.topbar{background:#fff;border-bottom:1px solid var(--border);padding:12px 24px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:50}
.logo{font-weight:700;font-size:17px;color:var(--purple);display:flex;align-items:center;gap:8px}
.logo small{font-weight:500;font-size:11px;color:var(--muted);display:block;margin-left:2px}
.role-switch{display:flex;gap:2px;background:var(--bg);padding:4px;border-radius:10px;border:1px solid var(--border)}
.role-switch button{border:none;background:transparent;padding:7px 18px;border-radius:7px;font-size:13px;font-weight:600;color:var(--muted);transition:.15s}
.role-switch button.active{background:#fff;color:var(--blue);box-shadow:0 1px 3px rgba(0,0,0,.1)}

main{padding:24px}
main.desktop{max-width:1180px;margin:0 auto}
main.mobile-wrap{max-width:420px;margin:0 auto;background:#fff;border-radius:28px;box-shadow:0 8px 40px rgba(15,23,42,.12);padding:24px 20px 20px;min-height:720px}

@media (max-width:500px){
  .topbar{padding:10px 14px}.logo{font-size:15px}.role-switch button{padding:6px 12px;font-size:12px}
  main{padding:12px}main.mobile-wrap{border-radius:0;box-shadow:none;min-height:calc(100vh - 60px);padding:20px 16px}
}

h1{font-size:22px;font-weight:700;margin-bottom:4px}
h2{font-size:17px;font-weight:700;margin-bottom:12px}
.muted{color:var(--muted);font-size:13px}
.page-header{margin-bottom:20px}

.toolbar{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.search-input{padding:10px 14px;border-radius:9px;border:1px solid var(--border);font-size:14px;flex:1;min-width:200px;max-width:320px;background:#fff;color:var(--text)}
.search-input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-50)}
.filter-chips{display:flex;gap:6px;flex-wrap:wrap}
.filter-chip{padding:8px 14px;border-radius:20px;border:1px solid var(--border);background:#fff;font-size:13px;font-weight:500;color:var(--muted);transition:.15s}
.filter-chip.active{background:var(--blue);border-color:var(--blue);color:#fff}

.patient-table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06);border:1px solid var(--border)}
.patient-table th{text-align:left;padding:12px 14px;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);background:var(--bg);border-bottom:1px solid var(--border);font-weight:600}
.patient-table td{padding:12px 14px;font-size:13px;border-bottom:1px solid var(--border);vertical-align:middle}
.patient-table tr:last-child td{border-bottom:none}
.patient-table tbody tr{cursor:pointer;transition:background .12s}
.patient-table tbody tr:hover{background:var(--blue-50)}
.patient-table tr.critical-row{background:var(--red-50)}
.patient-table tr.critical-row:hover{background:#fee2e2}
.patient-table tr.attention-row{background:var(--yellow-50)}
.patient-table tr.attention-row:hover{background:var(--yellow-100)}
.attention-icon{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;font-size:13px;background:var(--yellow-50);color:var(--yellow);font-weight:700}
.attention-icon.red{background:var(--red-50);color:var(--red)}

.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.dot.green{background:var(--green)}.dot.yellow{background:var(--yellow)}.dot.red{background:var(--red)}
.status{display:inline-flex;align-items:center;font-size:12px;font-weight:500}

.btn{padding:10px 18px;border-radius:9px;border:none;font-weight:600;font-size:14px;transition:.15s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn-primary{background:var(--blue);color:#fff}.btn-primary:hover{background:#1d4ed8}
.btn-secondary{background:var(--bg);color:var(--text);border:1px solid var(--border)}.btn-secondary:hover{background:var(--border)}
.btn-purple{background:var(--purple);color:#fff}.btn-purple:hover{background:#6d28d9}
.btn-danger{background:var(--red);color:#fff}.btn-danger:hover{background:#b91c1c}
.btn-block{width:100%}.btn-lg{padding:14px 20px;font-size:15px;border-radius:12px}
.btn-sm{padding:6px 12px;font-size:12px}

.card{background:#fff;border-radius:14px;padding:20px;border:1px solid var(--border);margin-bottom:16px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.card-title{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:14px}

.accordion{background:#fff;border-radius:14px;border:1px solid var(--border);margin-bottom:12px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.accordion-header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;cursor:pointer;transition:.15s;user-select:none}
.accordion-header:hover{background:var(--bg)}
.accordion-title{font-size:14px;font-weight:600;display:flex;align-items:center;gap:10px}
.accordion-icon{font-size:16px}
.accordion-chevron{font-size:14px;color:var(--muted);transition:.2s}
.accordion.open .accordion-chevron{transform:rotate(90deg)}
.accordion-body{display:none;padding:0 20px 20px;border-top:1px solid var(--border);padding-top:16px}
.accordion.open .accordion-body{display:block}

.banner{border-radius:12px;padding:14px 16px;margin-bottom:16px;display:flex;flex-direction:column;gap:10px;border-left:4px solid;font-size:14px}
.banner-yellow{background:var(--yellow-50);border-color:var(--yellow);color:#78350f}
.banner-red{background:var(--red-50);border-color:var(--red);color:#7f1d1d}
.banner-actions{display:flex;gap:8px;flex-wrap:wrap}
.banner-actions .btn{padding:7px 14px;font-size:13px}

.patient-critical{background:var(--red);color:#fff;border-radius:14px;padding:16px;margin-bottom:14px}
.patient-critical-title{font-size:15px;font-weight:700;margin-bottom:6px;line-height:1.3}
.patient-critical-text{font-size:13px;opacity:.95;line-height:1.45;margin-bottom:12px}
.patient-critical-buttons{display:flex;flex-direction:column;gap:8px}
.patient-critical-buttons .btn{background:#fff;color:var(--red);font-weight:700;padding:11px;font-size:13px;border:none}
.patient-critical-buttons .btn:active{opacity:.9}
.patient-critical-phones{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.patient-critical-phone{background:rgba(255,255,255,.18);border-radius:9px;padding:9px;text-align:center;color:#fff}
.patient-critical-phone .phone-label{font-size:9px;opacity:.9;text-transform:uppercase;letter-spacing:.4px;font-weight:600;margin-bottom:2px}
.patient-critical-phone .phone-num{font-size:16px;font-weight:800}

.profile{display:flex;align-items:center;gap:14px;margin-bottom:4px}
.avatar{width:48px;height:48px;border-radius:50%;background:var(--purple-50);color:var(--purple);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px}
.profile-info h2{margin-bottom:2px}
.profile-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tag{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600;background:var(--bg);color:var(--muted)}
.tag.purple{background:var(--purple-50);color:var(--purple)}
.tag.blue{background:var(--blue-50);color:var(--blue)}

.trend-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:600;margin-bottom:14px}
.trend-badge.good{background:var(--green-50);color:var(--green)}
.trend-badge.bad{background:var(--red-50);color:var(--red)}
.trend-badge.stable{background:var(--bg);color:var(--muted)}

.line-chart-wrap{max-width:640px;margin:0 auto}
.line-chart{width:100%;height:auto;display:block;margin-bottom:8px}
.chart-legend{display:flex;gap:16px;margin-bottom:14px;font-size:12px;flex-wrap:wrap;justify-content:center}
.chart-legend-item{display:flex;align-items:center;gap:6px}
.chart-legend-dot{width:10px;height:10px;border-radius:3px}
.chart-legend-dot.hollow{background:#fff;border:2px solid var(--green)}
.chart-note{font-size:11px;color:var(--muted);margin-top:10px;font-style:italic;text-align:center}

.event-feed{display:flex;flex-direction:column}
.event-item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.event-item:last-child{border-bottom:none}
.event-dot{width:10px;height:10px;border-radius:50%;margin-top:6px;flex-shrink:0}
.event-dot.blue{background:var(--blue)}.event-dot.purple{background:var(--purple)}
.event-dot.yellow{background:var(--yellow)}.event-dot.red{background:var(--red)}.event-dot.green{background:var(--green)}
.event-time{font-size:11px;color:var(--muted);margin-bottom:2px}
.event-text{font-size:13px;line-height:1.4}

.adverse-table{width:100%;border-collapse:collapse;font-size:13px}
.adverse-table th{text-align:left;padding:8px 10px;font-size:10px;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);font-weight:600;letter-spacing:.4px}
.adverse-table td{padding:9px 10px;border-bottom:1px solid var(--border)}
.adverse-table tr:last-child td{border-bottom:none}
.severity-badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600}
.severity-mild{background:var(--green-50);color:var(--green)}
.severity-medium{background:var(--yellow-50);color:var(--yellow)}
.severity-severe{background:var(--red-50);color:var(--red)}

.contra-list{display:flex;flex-direction:column;gap:6px}
.contra-item{display:flex;gap:10px;padding:9px 11px;border-radius:8px;background:var(--bg);font-size:12px;align-items:flex-start;line-height:1.45}
.contra-item.warning{background:var(--yellow-50)}
.contra-item.danger{background:var(--red-50)}
.contra-icon{font-size:13px;flex-shrink:0;margin-top:1px}
.ref-list{display:flex;flex-direction:column;gap:8px;font-size:13px}
.ref-list div{display:flex;gap:8px}
.ref-list strong{color:var(--text);min-width:120px;flex-shrink:0;font-size:12px}
.ref-list span{color:var(--muted);line-height:1.4}

.routing-list{display:flex;flex-direction:column;gap:8px}
.routing-item{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;font-size:13px;font-weight:500}
.routing-item.mandatory{background:var(--red-50);color:#7f1d1d}
.routing-item.desirable{background:var(--yellow-50);color:#78350f}
.routing-icon{font-size:16px;width:20px;text-align:center}

.form-field{margin-bottom:12px}
.form-label{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px;display:block}
.form-input,.form-textarea{width:100%;padding:9px 11px;border-radius:8px;border:1px solid var(--border);font-size:13px;background:#fff;color:var(--text)}
.form-input:focus,.form-textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-50)}
.form-textarea{resize:vertical;min-height:60px}
.form-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}

.greeting{margin-bottom:18px}
.greeting h2{font-size:22px;margin-bottom:4px}
.greeting .muted{font-size:14px}

.streak-card{background:linear-gradient(135deg,var(--purple-50),var(--blue-50));border-radius:14px;padding:16px;margin-bottom:14px;display:flex;align-items:center;gap:14px;border:1px solid var(--border)}
.streak-flame{font-size:30px}
.streak-info .streak-title{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:600;margin-bottom:2px}
.streak-info .streak-value{font-size:17px;font-weight:700;color:var(--purple)}
.streak-info .streak-sub{font-size:11px;color:var(--muted);margin-top:2px}

.task-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.task-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:12px 10px;text-align:center;transition:.15s;cursor:pointer}
.task-card:hover{border-color:var(--blue-100)}
.task-card.done{background:var(--green-50);border-color:#a7f3d0}
.task-icon{font-size:24px;margin-bottom:4px}
.task-title{font-size:12px;font-weight:600;margin-bottom:2px}
.task-status{font-size:10px;color:var(--muted)}
.task-card.done .task-status{color:var(--green);font-weight:600}

.task-input-panel{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:14px}
.task-input-label{font-size:13px;font-weight:600;margin-bottom:10px}
.diary-scale{display:flex;gap:6px;flex-wrap:wrap}
.diary-btn{width:38px;height:38px;border-radius:9px;border:1px solid var(--border);background:#fff;font-weight:600;font-size:13px;color:var(--muted);transition:.15s}
.diary-btn:hover{border-color:var(--blue-100)}
.diary-btn.selected{background:var(--blue);border-color:var(--blue);color:#fff}

.quick-links{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px}
.quick-link{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px;text-align:center;cursor:pointer;transition:.15s}
.quick-link:hover{border-color:var(--blue-100)}
.quick-link-icon{font-size:24px;margin-bottom:4px}
.quick-link-title{font-size:12px;font-weight:600}

.action-stack{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.info-note{font-size:11px;color:var(--muted);text-align:center;padding:10px;line-height:1.5}

.question{margin-bottom:20px}
.question-label{font-weight:600;margin-bottom:10px;font-size:14px}
.choice-row{display:flex;gap:10px;margin-bottom:10px}
.choice{flex:1;padding:14px;border-radius:12px;border:2px solid var(--border);background:#fff;font-size:14px;font-weight:600;color:var(--text);transition:.15s;text-align:center}
.choice:hover{border-color:var(--blue-100)}
.choice.selected{border-color:var(--green);background:var(--green-50);color:var(--green)}
.choice.danger-selected{border-color:var(--red);background:var(--red-50);color:var(--red)}

.med-dose{background:var(--bg);border-radius:12px;padding:14px;margin-bottom:10px;border:1px solid var(--border)}
.med-dose.done{background:var(--green-50);border-color:#a7f3d0}
.med-dose.missed{background:var(--red-50);border-color:#fecaca}
.med-dose-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.med-dose-title{font-size:13px;font-weight:700}
.med-dose-time{font-size:11px;color:var(--muted);font-weight:500}
.med-dose-buttons{display:flex;gap:8px}
.med-dose-buttons .choice{padding:10px;font-size:13px}

.reason-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.reason-chip{padding:7px 12px;border-radius:18px;border:1px solid var(--border);background:#fff;font-size:12px;font-weight:500;color:var(--muted);transition:.15s}
.reason-chip.selected{background:var(--purple-50);border-color:var(--purple);color:var(--purple)}

.symptom-list{display:flex;flex-direction:column;gap:6px}
.symptom-item{display:flex;align-items:flex-start;gap:10px;padding:11px 13px;border-radius:10px;border:1px solid var(--border);background:#fff;font-size:13px;cursor:pointer;transition:.15s}
.symptom-item:hover{border-color:var(--blue-100)}
.symptom-item.checked{background:var(--yellow-50);border-color:var(--yellow)}
.symptom-item.urgent-checked{background:var(--red-50);border-color:var(--red)}
.symptom-check{width:18px;height:18px;border-radius:5px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0;margin-top:1px}
.symptom-item.checked .symptom-check{background:var(--yellow);border-color:var(--yellow)}
.symptom-item.urgent-checked .symptom-check{background:var(--red);border-color:var(--red)}

/* БЛОК «СРОЧНО» */
.urgent-block{background:var(--red-50);border:2px solid var(--red);border-radius:14px;padding:16px;margin-bottom:16px}
.urgent-block-header{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.urgent-block-icon{font-size:22px}
.urgent-block-title{font-size:15px;font-weight:700;color:var(--red)}
.urgent-block-desc{font-size:12px;color:#7f1d1d;line-height:1.5;margin-bottom:12px}

/* БЛОК «ПРОЧИЕ» */
.other-block{background:#fff;border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:16px}
.other-block-header{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.other-block-icon{font-size:20px}
.other-block-title{font-size:15px;font-weight:700;color:var(--text)}
.other-block-desc{font-size:12px;color:var(--muted);line-height:1.5;margin-bottom:12px}

.textarea{width:100%;padding:11px;border-radius:10px;border:1px solid var(--border);font-size:13px;resize:vertical;min-height:70px;color:var(--text)}
.textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-50)}

.scale-q{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px}
.scale-q.critical{border-color:var(--red);background:#fff5f5}
.scale-q-label{font-size:13px;font-weight:500;margin-bottom:10px;line-height:1.4}
.scale-q-label .q-num{color:var(--purple);font-weight:700;margin-right:6px}
.scale-options{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.scale-option{padding:9px 4px;border-radius:7px;border:1px solid var(--border);background:#fff;font-size:11px;font-weight:500;text-align:center;transition:.15s;cursor:pointer;line-height:1.2}
.scale-option:hover{border-color:var(--blue-100)}
.scale-option.selected{background:var(--blue);border-color:var(--blue);color:#fff}
.scale-option.selected.danger{background:var(--red);border-color:var(--red)}

.question-number{display:inline-block;background:var(--purple-50);color:var(--purple);padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700;margin-bottom:12px;text-transform:uppercase;letter-spacing:.5px}

.emergency{text-align:center;padding:16px 0}
.emergency-icon{width:72px;height:72px;border-radius:50%;background:var(--red-50);color:var(--red);display:flex;align-items:center;justify-content:center;font-size:36px;margin:0 auto 18px}
.emergency h2{font-size:20px;margin-bottom:8px;line-height:1.35}
.emergency p{color:var(--muted);font-size:13px;line-height:1.5;margin-bottom:18px}
.phone-card{background:var(--red);color:#fff;border-radius:14px;padding:16px;margin-bottom:10px}
.phone-label{font-size:11px;opacity:.85;text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px;font-weight:600}
.phone-number{font-size:28px;font-weight:800;letter-spacing:-.5px}
.phone-card-outline{background:#fff;border:2px solid var(--red);color:var(--red)}
.phone-card-outline .phone-number{font-size:22px}
.emergency-note{background:var(--blue-50);color:var(--blue);border-radius:10px;padding:11px;font-size:12px;font-weight:600;margin:14px 0}

.info-list{display:flex;flex-direction:column;gap:8px}
.info-item{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:.15s}
.info-item:hover{border-color:var(--blue-100)}
.info-icon{font-size:26px;flex-shrink:0}
.info-text{flex:1}
.info-title{font-size:13px;font-weight:600;margin-bottom:2px}
.info-sub{font-size:11px;color:var(--muted)}

.tool-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tool-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px;cursor:pointer;transition:.15s;text-align:center}
.tool-card:hover{border-color:var(--blue-100)}
.tool-emoji{font-size:28px;margin-bottom:6px}
.tool-title{font-size:12px;font-weight:600;margin-bottom:3px}
.tool-desc{font-size:10px;color:var(--muted);line-height:1.3}

.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.stat-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px}
.stat-label{font-size:10px;text-transform:uppercase;color:var(--muted);font-weight:600;letter-spacing:.4px;margin-bottom:4px}
.stat-value{font-size:22px;font-weight:700;color:var(--blue)}
.stat-sub{font-size:10px;color:var(--muted);margin-top:2px}

.moment-list{display:flex;flex-direction:column;gap:8px}

.toggle::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}

@keyframes slideUp{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
.section-title{font-size:13px;font-weight:700;margin:16px 0 10px;color:var(--text)}

function regularityMeta(missed7) {

}

function trendOf(values, threshold = 1.5) {
  if (!values || values.length < 2) return { key: 'stable', label: 'Стабильно' };
  const diff = values[values.length - 1] - values[0];
  if (diff >= threshold) return { key: 'good', label: 'Улучшение' };
  if (diff <= -threshold) return { key: 'bad', label: 'Ухудшение' };
  return { key: 'stable', label: 'Стабильно' };
}
function surveyTrendOf(values, threshold = 1) {
  if (!values || values.length < 2) return { key: 'stable', label: 'Стабильно' };
  const diff = values[values.length - 1] - values[0];
  if (diff <= -threshold) return { key: 'good', label: 'Симптомы: снижаются' };
  if (diff >= threshold) return { key: 'bad', label: 'Симптомы: нарастают' };
  return { key: 'stable', label: 'Симптомы: стабильно' };
}
function phq9TrendOf(values) {
  if (!values || values.length < 2) return { key: 'stable', label: 'Стабильно' };
  const diff = values[values.length - 1] - values[0];
  if (diff >= 5) return { key: 'bad', label: 'PHQ-9: резкий рост' };
  if (diff >= 3) return { key: 'bad', label: 'PHQ-9: рост' };
  if (diff <= -5) return { key: 'good', label: 'PHQ-9: резкое снижение' };
  if (diff <= -3) return { key: 'good', label: 'PHQ-9: снижение' };
  return { key: 'stable', label: 'PHQ-9: стабильно' };
}

}

  const minY = 0, maxY = options.maxY || 10;
  const chartW = width - padL - padR;
  const chartH = height - padT - padB;
  const xStep = n > 1 ? chartW / (n - 1) : 0;
  const yOf = v => padT + chartH - ((v - minY) / (maxY - minY)) * chartH;

  let grid = '';
  for (let g = 0; g <= 4; g++) {
    const y = padT + (chartH / 4) * g;
    const val = maxY - (maxY - minY) * (g / 4);
    grid += `<line x1="${padL}" y1="${y}" x2="${width - padR}" y2="${y}" stroke="#e2e8f0" stroke-width="1"/>`;
    grid += `<text x="${padL - 8}" y="${y + 4}" text-anchor="end" font-size="10" fill="#94a3b8">${Math.round(val)}</text>`;
  }

  const labels = (options.labels || series[0].values.map((_, i) => i + 1));
  let xLabels = '';
  labels.forEach((lab, i) => {
    const x = padL + xStep * i;
    xLabels += `<text x="${x}" y="${height - 10}" text-anchor="middle" font-size="11" fill="#94a3b8">${esc(lab)}</text>`;
  });

  let paths = '', dots = '';
  series.forEach((s) => {
    const pts = s.values.map((v, i) => {
      let y = yOf(v);
      if (s.shiftIfClose) {
        const other = s.shiftIfClose.value[i];
        if (Math.abs(v - other) < 0.3) y -= 3;
      }
      return { x: padL + xStep * i, y, trueVal: v };
    });
    const d = pts.map((p, i) => (i === 0 ? `M${p.x},${p.y}` : `L${p.x},${p.y}`)).join(' ');
    const sw = s.width || 3;
    paths += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${sw}" stroke-linejoin="round" stroke-linecap="round" opacity="0.95"/>`;
    const dotFill = s.hollow ? '#fff' : s.color;
    pts.forEach((p, i) => {
      dots += `<circle cx="${p.x}" cy="${p.y}" r="5" fill="${dotFill}" stroke="${s.color}" stroke-width="2.5"><title>${esc(s.tooltip ? s.tooltip(i, p.trueVal) : p.trueVal)}</title></circle>`;
    });
  });

  return `<div class="line-chart-wrap"><svg class="line-chart" viewBox="0 0 ${width} ${height}">
    ${grid}${xLabels}${paths}${dots}
  </svg></div>`;
}

function renderDoctorList() {
  let list = patients.slice();
  if (state.search) {

    list = list.filter(p => p.name.toLowerCase().includes(q));
  }
  if (state.doctorFilter === 'attention') list = list.filter(p => p.alert && p.alert.type === 'yellow');
  if (state.doctorFilter === 'critical') list = list.filter(p => p.alert && p.alert.type === 'red');
  if (state.doctorFilter === 'stable') list = list.filter(p => !p.alert);

  const critical = patients.filter(p => p.alert && p.alert.type === 'red').length;
  const attention = patients.filter(p => p.alert && p.alert.type === 'yellow').length;

  const rows = list.map(p => {
    const r = regularityMeta(p.missed7);

/* ============ PATIENT: SCALES ============ */
function renderPatientScale(type) {
  const isPhq = type === 'phq9';
  const isCssrs = type === 'cssrs';

  if (isCssrs) {
    const opts = CSSRS_OPTIONS.map(o => `
      <button class="scale-option ${state.cssrs === o.v ? 'selected' : ''} ${o.v >= 3 && state.cssrs === o.v ? 'danger' : ''}"
        style="padding:14px 12px;text-align:left;font-size:13px;grid-column:span 4;margin-bottom:6px"
        data-action="cssrs-answer" data-v="${o.v}">${esc(o.label)}</button>`).join('');
    return `<button class="back-link" data-action="back-home">← На главную</button>
      <div class="question-number">C-SSRS · по показаниям</div>
      <h2 style="margin-bottom:6px">Оценка суицидального риска</h2>
      <p class="muted" style="margin-bottom:16px;font-size:12px">Выберите наиболее подходящий вариант за последний месяц.</p>
      <div class="scale-options" style="grid-template-columns:1fr">${opts}</div>
      <button class="btn btn-danger btn-lg btn-block" data-action="submit-cssrs" style="margin-top:16px">Отправить</button>
      <div class="info-note">≥ 3 — серьёзный риск. ≥ 5 или суицидальное поведение — экстренная помощь.</div>`;
  }

  const questions = isPhq ? PHQ9_QUESTIONS : GAD7_QUESTIONS;
  const values = isPhq ? state.phq9 : state.gad7;
  const items = questions.map((q, i) => {
    const critical = isPhq && i === 8;
    const val = values[i];
    const opts = SCALE_OPTIONS.map(o => `
      <button class="scale-option ${val === o.v ? 'selected' : ''} ${critical && o.v > 0 && val === o.v ? 'danger' : ''}"
        data-action="${isPhq ? 'phq9-answer' : 'gad7-answer'}" data-q="${i}" data-v="${o.v}">${o.label}</button>`).join('');
    return `<div class="scale-q ${critical ? 'critical' : ''}">
      <div class="scale-q-label"><span class="q-num">${i + 1}.</span>${esc(q)}${critical ? ' <span style="color:var(--red);font-size:11px">(критический)</span>' : ''}</div>
      <div class="scale-options">${opts}</div>
    </div>`;
  }).join('');

  return `<button class="back-link" data-action="back-home">← На главную</button>
    <div class="question-number">${isPhq ? 'PHQ-9 · раз в 2–4 недели' : 'GAD-7 · раз в 2–4 недели'}</div>
    <h2 style="margin-bottom:6px">${isPhq ? 'Шкала PHQ-9' : 'Шкала GAD-7'}</h2>
    <p class="muted" style="margin-bottom:16px;font-size:12px">Необязательный опросник. Результат увидит врач.</p>
    ${items}
    <button class="btn btn-purple btn-lg btn-block" data-action="${isPhq ? 'submit-phq9' : 'submit-gad7'}" style="margin-top:12px">Отправить</button>
    ${isPhq ? `<div class="info-note">Вопрос 9 — критический. Любой ответ > 0 открывает экстренный экран и отправляет алерт врачу.</div>` : ''}`;
}

/* ============ ROUTER ============ */
function render() {
  const app = $('#app');
  document.querySelectorAll('.role-switch button').forEach(b =>
    b.classList.toggle('active', b.dataset.role === state.role));

  if (state.role === 'doctor') {
    app.className = 'desktop';
    app.innerHTML = state.doctorScreen === 'list' ? renderDoctorList() : renderDoctorPatient();
  } else {
    app.className = 'mobile-wrap';
    switch (state.patientScreen) {
      case 'home': app.innerHTML = renderPatientHome(); break;
      case 'checkin': app.innerHTML = renderPatientCheckin(); break;
      case 'adverse': app.innerHTML = renderPatientAdverse(); break;
      case 'phq9': app.innerHTML = renderPatientScale('phq9'); break;
      case 'gad7': app.innerHTML = renderPatientScale('gad7'); break;
      case 'cssrs': app.innerHTML = renderPatientScale('cssrs'); break;
      case 'psycho': app.innerHTML = renderPatientPsycho(); break;
      case 'selfhelp': app.innerHTML = renderPatientSelfhelp(); break;
      case 'stats': app.innerHTML = renderPatientStats(); break;
      case 'reminders': app.innerHTML = renderPatientReminders(); break;
      case 'emergency': app.innerHTML = renderPatientEmergency(); break;
      default: app.innerHTML = renderPatientHome();
    }
  }

  const modalWrap = document.createElement('div');
  modalWrap.innerHTML = renderModal();
  if (modalWrap.firstChild) app.appendChild(modalWrap.firstChild);
}

/* ============ ACTIONS ============ */
function submitCheckin() {
  const c = state.checkin;
  if (c.morning === null && c.evening === null) {
    showToast('Отметьте приём хотя бы одного приёма');
    return;
  }
  const p = currentPatient();
  state.streak += 1;
  p.lastCheckin = 'только что';

  const missedCount = (c.morning === false ? 1 : 0) + (c.evening === false ? 1 : 0);
  if (missedCount > 0) {
    p.missed7 += missedCount;
    if (p.missed7 >= 2 && !p.alert) {
      p.alert = { type: 'yellow', text: 'Пациент пропустил приём препарата. Проверьте, если останется время.' };
    }
  }
  const text = `Отметка самочувствия: утренний ${c.morning === true ? '✓' : c.morning === false ? '✗ (' + (c.morningReason || 'причина') + ')' : '—'}, вечерний ${c.evening === true ? '✓' : c.evening === false ? '✗ (' + (c.eveningReason || 'причина') + ')' : '—'}`;
  p.events.unshift({ time: 'Только что', text, dot: missedCount ? 'yellow' : 'green' });

  state.checkin = { morning: null, evening: null, morningReason: null, eveningReason: null, morningReasonOther: '', eveningReasonOther: '' };
  state.patientScreen = 'home';
  render();
  showToast('Отметка отправлена ✓');
}

function submitAdverse() {
  const a = state.adverse;
  if (!a.symptoms.length && !a.freeText.trim()) { showToast('Отметьте хотя бы один симптом'); return; }
  const p = currentPatient();
  const urgent = a.symptoms.some(id => ADVERSE_URGENT_IDS.has(id));

  const labels = a.symptoms.map(id => {
    const u = PATIENT_URGENT_SYMPTOMS.find(s => s.id === id);
    if (u) return u.label;
    const o = PATIENT_OTHER_SYMPTOMS.find(s => s.id === id);
    if (o) return o.label;
    return id;
  });

  if (urgent) p.alert = { type: 'red', text: `Критическое НЯ: ${labels.join(', ')}. Требуется немедленная оценка.` };
  else if (labels.length) p.alert = { type: 'yellow', text: `НЯ: ${labels.join(', ').toLowerCase()}.` };
  else p.alert = { type: 'yellow', text: 'Пациент сообщил о неприятных симптомах (описание).' };

  p.events.unshift({ time: 'Только что', text: `НЯ: ${labels.join(', ') || 'описание'}`, dot: urgent ? 'red' : 'yellow' });
  state.adverse = { symptoms: [], freeText: '' };
  state.patientScreen = 'home';
  render();
  showToast('Сообщение отправлено врачу');
}

function submitPhq9() {
  const q9 = state.phq9[8];
  const p = currentPatient();
  const sum = state.phq9.reduce((a, b) => a + b, 0);
  p.events.unshift({ time: 'Только что', text: `Пациент прошёл PHQ-9 (${sum})`, dot: 'purple' });
  if (q9 > 0) {
    p.alert = { type: 'red', text: 'Критический алерт: суицидальные мысли (PHQ-9, п.9).' };
    state.patientScreen = 'emergency'; render(); return;
  }
  state.patientScreen = 'home'; render(); showToast('Ответы отправлены ✓');
}
function submitGad7() {
  const sum = state.gad7.reduce((a, b) => a + b, 0);
  const p = currentPatient();
  p.events.unshift({ time: 'Только что', text: `Пациент прошёл GAD-7 (${sum})`, dot: 'purple' });
  state.patientScreen = 'home'; render(); showToast('Ответы отправлены ✓');
}
function submitCssrs() {
  const v = state.cssrs;
  const p = currentPatient();
  p.events.unshift({ time: 'Только что', text: `Пациент прошёл C-SSRS: ${v}`, dot: v >= 3 ? 'red' : 'purple' });
  if (v >= 5) {
    p.alert = { type: 'red', text: 'Критический алерт: C-SSRS ≥ 5 (план/намерение).' };
    state.patientScreen = 'emergency'; render(); return;
  }
  if (v >= 3) {
    p.alert = { type: 'red', text: `C-SSRS = ${v}: серьёзный риск. Требуется оценка врача.` };
    state.patientScreen = 'home'; render(); showToast('Врач получил уведомление'); return;
  }
  state.patientScreen = 'home'; render(); showToast('Ответы отправлены ✓');
}

function handleAction(action, el) {
  const id = el.dataset.id;
  const key = el.dataset.key;
  switch (action) {
    case 'switch-role': state.role = el.dataset.role; render(); break;
    case 'open-patient': state.selectedPatientId = id; state.doctorScreen = 'patient'; state.accordions = {}; render(); break;
    case 'back-to-list': state.doctorScreen = 'list'; render(); break;
    case 'filter': state.doctorFilter = el.dataset.val; render(); break;
    case 'dismiss-alert': { const p = getPatient(id); if (p) p.alert = null; render(); showToast('Алерт отмечен как просмотренный'); break; }
    case 'notify-patient': openModal(notifyPatientModal(id || state.selectedPatientId)); break;
    case 'send-notify': closeModal(); showToast('Уведомление отправлено пациенту'); break;
    case 'open-grls': openModal(grlsModal()); break;
    case 'close-modal': closeModal(); break;
    case 'toggle-accordion': { const acc = el.dataset.acc; state.accordions[acc] = !state.accordions[acc]; render(); break; }
    case 'add-patient': showToast('В MVP пациенты добавляются через интеграцию с МИС. Демо-набор фиксирован.'); break;
    case 'back-home': state.patientScreen = 'home'; state.activeTask = null; render(); break;
    case 'open-checkin': state.checkin = { morning: null, evening: null, morningReason: null, eveningReason: null, morningReasonOther: '', eveningReasonOther: '' }; state.patientScreen = 'checkin'; render(); break;
    case 'open-adverse': state.patientScreen = 'adverse'; render(); break;
    case 'open-phq9': state.patientScreen = 'phq9'; render(); break;
    case 'open-gad7': state.patientScreen = 'gad7'; render(); break;
    case 'open-cssrs': state.patientScreen = 'cssrs'; render(); break;
    case 'open-psycho': state.patientScreen = 'psycho'; render(); break;
    case 'open-selfhelp': state.patientScreen = 'selfhelp'; render(); break;
    case 'open-stats': state.patientScreen = 'stats'; render(); break;
    case 'open-reminders': state.patientScreen = 'reminders'; render(); break;
    case 'open-contact-doctor': openModal(contactDoctorModal()); break;
    case 'toggle-scales': state.scalesOpen = !state.scalesOpen; render(); break;
    case 'set-dose': {
      const v = el.dataset.val === 'yes';
      state.checkin[key] = v;
      if (v) { state.checkin[key + 'Reason'] = null; state.checkin[key + 'ReasonOther'] = ''; }
      render(); break;
    }
    case 'set-reason': state.checkin[key + 'Reason'] = el.dataset.val; render(); break;
    case 'submit-checkin': submitCheckin(); break;
    case 'toggle-adverse': {
      const s = el.dataset.id;
      const i = state.adverse.symptoms.indexOf(s);
      if (i >= 0) state.adverse.symptoms.splice(i, 1); else state.adverse.symptoms.push(s);
      render(); break;
    }
    case 'submit-adverse': submitAdverse(); break;
    case 'phq9-answer': state.phq9[+el.dataset.q] = +el.dataset.v; render(); break;
    case 'gad7-answer': state.gad7[+el.dataset.q] = +el.dataset.v; render(); break;
    case 'cssrs-answer': state.cssrs = +el.dataset.v; render(); break;
    case 'submit-phq9': submitPhq9(); break;
    case 'submit-gad7': submitGad7(); break;
    case 'submit-cssrs': submitCssrs(); break;
    case 'open-task': { if (state.dailyTasks[key].done) { showToast('Уже заполнено'); break; } state.activeTask = key; render(); break; }
    case 'set-task-value': {
      state.dailyTasks[key].done = true;
      state.dailyTasks[key].value = el.dataset.val;
      state.activeTask = null;
      render(); showToast('Сохранено ✓'); break;
    }
    case 'read-article': showToast('Открытие материала (демо)'); break;
    case 'open-tool': showToast('Запуск упражнения (демо)'); break;
    case 'toggle-reminder': { const r = state.reminders.find(x => x.id === +id); if (r) r.on = !r.on; render(); break; }
  }
}

/* ============ EVENTS ============ */
document.addEventListener('click', e => {
  const overlay = e.target.closest('.modal-overlay');
  if (overlay && e.target === overlay) { closeModal(); return; }
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const a = el.dataset.action;
  if (a === 'search') return;
  if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') return;
  if (['note-input','notify-text','reason-other','adverse-text'].includes(a)) return;
  handleAction(a, el);
});

document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.action === 'search') { state.search = t.value; render(); }
  else if (t.dataset.action === 'adverse-text') { state.adverse.freeText = t.value; }
  else if (t.dataset.action === 'reason-other') { state.checkin[t.dataset.key + 'ReasonOther'] = t.value; }
  else if (t.dataset.action === 'note-input') {
    const pid = t.dataset.id;
    if (!state.doctorNotes[pid]) state.doctorNotes[pid] = { phq9:'', gad7:'', cssrs:'', hamA:'', hamD:'', otherTests:'', impression:'', note:'' };
    state.doctorNotes[pid][t.dataset.field] = t.value;
  }
});

/* ============ INIT ============ */
state.phq9 = [1,1,2,1,1,1,2,1,0];
state.gad7 = [1,1,1,1,1,1,1];
state.cssrs = 0;
render();
</script>
